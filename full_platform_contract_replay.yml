name: Dashboard Contract Replay

on:
  workflow_dispatch:
    inputs:
      dashboard_ref:
        description: "Dashboard commit SHA or branch to replay"
        required: true
        default: "main"
      replay_label:
        description: "Human-readable dashboard replay label"
        required: true
        default: "dashboard-contract-replay"

permissions:
  contents: read

jobs:
  replay:
    name: Dashboard contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOVEREIGN_INGESTION_TOKEN: hosted-replay-owner-token
      SOVEREIGN_REVIEWER_TOKENS_JSON: '{"reviewer-alpha":"hosted-replay-reviewer-alpha","reviewer-beta":"hosted-replay-reviewer-beta"}'
      BUILT_IN_FORGE_API_URL: https://replay.invalid
      BUILT_IN_FORGE_API_KEY: hosted-replay-forge-key
    steps:
      - name: Check out dashboard source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dashboard_ref }}
          path: dashboard

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Set up ephemeral replay signing key
        run: |
          openssl genpkey -algorithm ED25519 -out "$RUNNER_TEMP/ephemeral-replay-signing-key.pem"
          {
            echo "SOVEREIGN_RECEIPT_SIGNING_PRIVATE_KEY<<EOF"
            cat "$RUNNER_TEMP/ephemeral-replay-signing-key.pem"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Install dashboard dependencies
        run: |
          corepack enable
          cd dashboard
          pnpm install --frozen-lockfile

      - name: Record dashboard replay identity
        run: |
          mkdir -p replay-evidence
          git -C dashboard rev-parse HEAD | tee replay-evidence/dashboard_commit.txt
          sha256sum \
            dashboard/client/src/signingKeyHistoryContract.test.ts \
            dashboard/client/src/receiptSigningSecret.test.ts \
            dashboard/server/receiptBundles.ts \
            dashboard/server/routers.ts \
          > replay-evidence/dashboard_source_hashes.sha256
          printf '%s\n' "${{ inputs.replay_label }}" > replay-evidence/replay_label.txt
          printf '%s\n' "${{ inputs.dashboard_ref }}" > replay-evidence/requested_dashboard_ref.txt

      - name: Run dashboard contract suite and build
        run: |
          set -o pipefail
          cd dashboard
          pnpm test 2>&1 | tee "$GITHUB_WORKSPACE/replay-evidence/dashboard_contracts.log"
          pnpm build 2>&1 | tee "$GITHUB_WORKSPACE/replay-evidence/dashboard_build.log"

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-contract-replay-${{ github.run_id }}
          path: replay-evidence/
          if-no-files-found: error
