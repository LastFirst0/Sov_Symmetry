[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-engine"
version = "1.0.0"
description = "Sovereign Engine — Verifiable AI runtime and P2P consensus layer built on 240-root E8 Exceptional Lie Geometry and Hopf Fibered Manifolds"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [
    { name = "Sovereign Core Team" }
]
keywords = ["ai", "geometry", "e8", "hopf-fibration", "p2p", "mcp", "ollama", "sovereign"]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "jsonschema>=4.26.0",
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
sovereign-engine = "scripts.sovereign_workbench:main"
sovereign-ollama = "scripts.sovereign_ollama_server:main"
sovereign-mcp = "scripts.sovereign_mcp_server:main"
sovereign-web = "scripts.web_ui_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sov_*", "sovereign_*", "scripts*"]

[tool.setuptools.package-data]
"sov_evidence_geometry_core" = ["schemas/*.json"]
